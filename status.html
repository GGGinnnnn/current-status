<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>电脑状态</title>
</head>
<body>
  <h2>💻 当前电脑状态</h2>
  <div id="status">加载中...</div>

  <script>
    async function refresh() {
      const r = await fetch(
        "https://curly-scene-7514.1504188084.workers.dev/status"
      );
      const j = await r.json();
      document.getElementById("status").innerText = j.status;
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
